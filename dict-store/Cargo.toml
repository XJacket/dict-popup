[package]
name = "dict-store"
version = "0.3.0"
edition = "2021"
description = "Dictionary package library: manifest, version history, checksums, provider seam"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
