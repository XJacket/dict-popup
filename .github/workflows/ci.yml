name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (GNU toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Use the GNU toolchain
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-gnu
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test dict-core
        shell: pwsh
        run: cargo test --release --manifest-path dict-core/Cargo.toml

      - name: Test dict-input
        shell: pwsh
        run: cargo test --release --manifest-path dict-input/Cargo.toml

      - name: Test dict-popup
        shell: pwsh
        run: cargo test --release --manifest-path dict-popup/Cargo.toml

      - name: Build release
        shell: pwsh
        run: |
          # build.bat compiles the resource file with windres and links it in.
          cmd /c build.bat
          Get-Item dist\dict-popup.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dict-popup-unsigned
          path: dist/dict-popup.exe
          if-no-files-found: error
