[package]
name = "dict-core"
version = "0.1.0"
edition = "2021"
description = "StarDict reader: mmap + offset-table binary search, direction fingerprint"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
