[package]
name = "dict-popup"
version = "0.1.0"
edition = "2021"
description = "Offline dictionary lookup with a modern floating card"

[dependencies]
# UI
eframe = "0.37"
egui = "0.37"

# config + logs
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Win32: hotkey, UIA selection, tray, memory-mapped dictionary files
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
